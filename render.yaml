# Render Blueprint — 단일 팀 체험용 독립형 워크스페이스 (무료 플랜)
# 무료 인스턴스는 15분 미사용 시 잠들고, 재시작·재배포·잠들기 시 데이터가 초기화됩니다.
services:
  - type: web
    name: meeting-automation
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/container/Dockerfile
    dockerContext: .
    healthCheckPath: /api/healthz
    autoDeployTrigger: commit
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      # onrender.com은 Cloudflare 뒤에 있음 — Cloudflare가 매 요청 덮어쓰는 헤더라 위조 불가
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # 백엔드 내부 인증 키 — 사람이 쓸 일 없음, Render가 임의 값 생성
      - key: BACKEND_API_KEY
        generateValue: true
      # 최초 관리자 계정 — 사용자가 없을 때만 생성. 비밀번호는 대시보드 Environment에서 확인
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
