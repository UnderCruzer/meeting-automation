# Render Blueprint — 단일 팀 체험용 독립형 워크스페이스 (무료 플랜)
# 무료 인스턴스는 15분 미사용 시 잠들고, 재시작·재배포·잠들기 시 데이터가 초기화됩니다.
services:
  - type: web
    name: meeting-automation
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/container/Dockerfile
    dockerContext: .
    healthCheckPath: /api/healthz
    autoDeployTrigger: commit
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      # 기본 모델이 혼잡(503)·한도(429)로 재시도 후에도 실패하면 순서대로 시도
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.1-flash-lite
      # onrender.com은 Cloudflare 뒤에 있음 — Cloudflare가 매 요청 덮어쓰는 헤더라 위조 불가
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Slack 채널 게시(선택) — 비워두면 게시하지 않음. docs/OPERATIONS.md "Slack 채널 게시" 참고
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_BRIEF_CHANNEL
        sync: false
      # 품질 경고·주간 품질 리포트용 관리자 채널 ID (선택)
      - key: MONITOR_ALERT_CHANNEL
        sync: false
      - key: WORKSPACE_TIMEZONES
        value: Asia/Seoul
      # 워크플로 1~3 (캘린더 감지 → Slack DM → 녹음 준비 승인). 둘 다 있어야 Slack 봇이 실행됨
      - key: SLACK_APP_TOKEN
        sync: false
      - key: CALENDAR_ICS_URLS
        sync: false
      - key: DEFAULT_TIMEZONE
        value: Asia/Seoul
      # 워크플로 10·12·13 Jira·Confluence (선택) — docs/OPERATIONS.md "Jira·Confluence 연결"
      - key: ATLASSIAN_BASE_URL
        sync: false
      - key: ATLASSIAN_EMAIL
        sync: false
      - key: ATLASSIAN_API_TOKEN
        sync: false
      - key: JIRA_PROJECT_KEY
        sync: false
      - key: CONFLUENCE_SPACE_KEY
        sync: false
      # 워크플로 4: Slack DM 녹음 링크 서명 키 (봇과 웹이 공유) — 자동 생성
      - key: RECORDING_LINK_SECRET
        generateValue: true
      # 백엔드 내부 인증 키 — 사람이 쓸 일 없음, Render가 임의 값 생성
      - key: BACKEND_API_KEY
        generateValue: true
      # 최초 관리자 계정 — 사용자가 없을 때만 생성. 비밀번호는 대시보드 Environment에서 확인
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
