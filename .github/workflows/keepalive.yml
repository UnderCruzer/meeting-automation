# 서버 상태 확인(장애 알림) + 절전 방지.
# Render 무료 인스턴스는 외부 요청이 15분 없으면 잠들어 캘린더 감지(워크플로 1단계)가 멈춥니다.
# 저장소 변수 KEEPALIVE_URL(예: https://meeting-automation.onrender.com)을 설정한 경우에만 10분마다 확인합니다.
# 한 서비스를 계속 켜두면 월 약 744시간으로 무료 750시간 안에 들어갑니다.
# /api/healthz는 웹과 백엔드가 모두 응답할 때만 200입니다. 실패하면 이 워크플로가 실패로 표시되고(GitHub 알림),
# 저장소 시크릿 ALERT_SLACK_WEBHOOK(Slack Incoming Webhook URL)이 있으면 그 채널에도 알립니다.
name: Keep deployment awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: ${{ vars.KEEPALIVE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KEEPALIVE_URL: ${{ vars.KEEPALIVE_URL }}
      ALERT_SLACK_WEBHOOK: ${{ secrets.ALERT_SLACK_WEBHOOK }}
    steps:
      - name: Ping health check
        # A sleeping free instance takes about a minute to wake: allow for it before calling it down.
        run: curl -fsS --max-time 90 --retry 3 --retry-delay 20 --retry-all-errors "${KEEPALIVE_URL%/}/api/healthz"
      - name: Alert on failure
        if: ${{ failure() && env.ALERT_SLACK_WEBHOOK != '' }}
        run: |
          payload=$(jq -n --arg url "$KEEPALIVE_URL" --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{text: ("🚨 *[서버 경고]* " + $url + " 상태 확인 실패 (웹 또는 백엔드 응답 없음) — " + $run)}')
          curl -fsS -X POST -H "Content-Type: application/json" --data "$payload" "$ALERT_SLACK_WEBHOOK"
